fake: collectors/fake.py

# Install backup-collector in the worker environment (or use its absolute path).
backup_collector:
  command: [backup-collector, collect]
  report_format: backup_collector
  defaults:
    include_period: true
  context_args:
    asset: host
    start-date: {field: period_start, when: include_period}
    end-date: {field: period_end, when: include_period}
  parameter_args:
    scope: scope
    type: type
    dry-run: dry_run
    debug: debug
  required_parameters: [scope, type]
