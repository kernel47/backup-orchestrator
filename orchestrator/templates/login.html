<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in · Backup Orchestrator</title><link rel="stylesheet" href="/static/login.css?v=1"></head>
<body>
<main class="login-card">
<a class="brand" href="/login"><span class="brand-mark" aria-hidden="true">▥</span><span>BACKUP<small>ORCHESTRATOR</small></span></a>
<div class="intro"><h1>Sign in</h1><p>Manage your collectors, schedules and satellites.</p></div>
{% if error %}<div class="error" role="alert">{{error}}</div>{% endif %}
{% if not configured %}<div class="error" role="alert">Login is not configured. Set AUTH_USERNAME and AUTH_PASSWORD in the master .env file.</div>{% endif %}
<form action="/login" method="post">
<input type="hidden" name="csrf" value="{{challenge}}"><input type="hidden" name="next" value="{{next_url}}">
<label for="username">Username</label><input id="username" name="username" value="{{username}}" autocomplete="username" maxlength="80" required autofocus>
<label for="password">Password</label><input id="password" type="password" name="password" autocomplete="current-password" maxlength="1024" required>
<button type="submit" {% if not configured %}disabled{% endif %}>Sign in <span aria-hidden="true">→</span></button>
</form>
<footer>Backup Orchestrator · Collection orchestration</footer>
</main>
</body></html>
