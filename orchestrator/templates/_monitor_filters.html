<form class="filters compact-filters history-filters" method="get" data-linked-filters>
  <input type="hidden" name="view" value="runs">
  <input type="hidden" name="workspace" value="{{active_zone}}">
  {% if filters.get('status') %}<input type="hidden" name="status" value="{{filters.status}}">{% endif %}
  <div class="basic-filters">
    <label>View<select name="period">{% for value,label in [('day','Day'),('week','Week'),('month','Month')] %}<option value="{{value}}" {{'selected' if period==value}}>{{label}}</option>{% endfor %}</select></label>
    <label>Collection date<input type="date" name="date" value="{{filters.date}}"></label>
    <label>Scope<select name="scope"><option value="">All scopes</option>{% for scope in catalog.scopes %}<option value="{{scope}}" {{'selected' if filters.get('scope')==scope}}>{{scope}}</option>{% endfor %}</select></label>
    <label>Collector<select name="collector_id"><option value="">All collectors</option>{% for c in collectors %}<option value="{{c.id}}" data-scope="{{c.scope}}" {{'selected' if filters.get('collector_id')==c.id}} {% if filters.get('scope') and filters.scope!=c.scope %}hidden disabled{% endif %}>{{c.name}}</option>{% endfor %}</select></label>
    <label>Host group<select name="host_group_id"><option value="">All host groups</option>{% for group in host_groups %}<option value="{{group.id}}" {{'selected' if filters.get('host_group_id')==group.id}}>{{group.name}}</option>{% endfor %}</select></label>
    <label>Host<select name="host"><option value="">All hosts</option>{% for h in hosts %}<option value="{{h.id}}" data-groups="{{host_memberships.get(h.id,[])|tojson|forceescape}}" {{'selected' if filters.get('host')==h.id}} {% if filters.get('host_group_id') and filters.host_group_id not in host_memberships.get(h.id,[]) %}hidden disabled{% endif %}>{{h.id}}</option>{% endfor %}</select></label>
    <div class="history-filter-actions">
      <button type="submit" class="button primary filter-apply">Apply</button>
      <a class="button" href="/?view=runs&workspace={{active_zone|urlencode}}&period=day&date={{today}}&page=1">Reset</a>
    </div>
  </div>
</form>
