# Exemple unitaire. La registration complète utilise server/register.py et le .env.
name: backup-orchestrator
build: null
push: null
pull:
  - prefect.deployments.steps.set_working_directory:
      directory: /data/backup-orchestrator/worker
deployments:
  - name: emea-sat01-jobs
    entrypoint: workers/flows/netbackup.py:netbackup_flow
    parameters:
      asset: jobs
      start_date: null
      end_date: null
    schedules:
      - cron: "0 * * * *"
        timezone: UTC
        active: true
    concurrency_limit: 1
    work_pool:
      name: backup-emea-01
      job_variables:
        working_dir: /data/backup-orchestrator/worker
